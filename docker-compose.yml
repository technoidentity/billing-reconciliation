services:
  sftp:
    container_name: billing-sftp
    image: atmoz/sftp:alpine
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./docker/sftp/users.conf:/etc/sftp/users.conf:ro
      # Codebase SFTP mount: drop files in sftp/home, processed copies in sftp/destination.
      - ./sftp/home:/home/billing/home
      - ./sftp/destination:/home/billing/destination
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - billing-net

  temporal-postgres:
    container_name: temporal-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billing-net

  temporal:
    container_name: billing-temporal
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - billing-net

  temporal-ui:
    container_name: billing-temporal-ui
    image: temporalio/ui:2.40.1
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8088:8080"
    networks:
      - billing-net

  app:
    container_name: billing-app
    build: .
    restart: unless-stopped
    depends_on:
      sftp:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_ENABLE_HTTPS: ${TEMPORAL_ENABLE_HTTPS:-false}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_IDENTITY: ${TEMPORAL_IDENTITY:-}
      VENDOR_API_URL: http://localhost:8080
      CUSTOMER_API_URL: http://localhost:8080
      BILLING_FILES_MODE: sftp
      BILLING_SFTP_ROOT: /sftp
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_USER: billing
      SFTP_PASSWORD: billing
      SFTP_HOME_DIR: home
      SFTP_DESTINATION_DIR: destination
    volumes:
      - ./sftp:/sftp
    ports:
      - "8080:8080"
    networks:
      - billing-net

volumes:
  temporal-postgres-data:

networks:
  billing-net:
    driver: bridge
