server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: billing-reconciliation
  # Temporal: local docker defaults, or TEMPORAL_* env vars for Cloud.
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:127.0.0.1:7233}          # Cloud: <ns>.<accountId>.tmprl.cloud:7233
      enable-https: ${TEMPORAL_ENABLE_HTTPS:${TEMPORAL_TLS:false}}  # TLS for Temporal Cloud (also on when api-key is set)
      api-key: ${TEMPORAL_API_KEY:}                       # Cloud API key (blank locally)
    namespace: ${TEMPORAL_NAMESPACE:default}             # Cloud: <namespace>.<accountId>
    identity: ${TEMPORAL_IDENTITY:}                      # worker identity in the UI (blank = host@pid)
    start-workers: true
    workers-auto-discovery:
      packages:
        - com.billing.reconciliation
    workers:
      - task-queue: ${TEMPORAL_TASK_QUEUE:billing-reconciliation-queue}
        name: billing-reconciliation-worker
        capacity:
          max-concurrent-workflow-task-executors: ${WORKER_WORKFLOW_EXECUTORS:50}
          max-concurrent-activity-executors: ${WORKER_ACTIVITY_EXECUTORS:100}
          max-concurrent-local-activity-executors: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.billing.reconciliation: INFO
    io.temporal: WARN

# All billing / Temporal business knobs live here. Workflows receive a snapshot of
# these values as input so activity timeouts stay deterministic on replay.
billing:
  task-queue: ${TEMPORAL_TASK_QUEUE:billing-reconciliation-queue}
  batch-size: ${BILLING_BATCH_SIZE:100000}
  max-parallel-batches: ${BILLING_MAX_PARALLEL_BATCHES:12}

  coordinator:
    workflow-id: ${BILLING_COORDINATOR_ID:billing-reconciliation-coordinator}
    auto-start: ${BILLING_COORDINATOR_AUTO_START:true}

  # Docker SFTP is bind-mounted from ./sftp.
  #   sftp/home          → /home/billing/home         (drop)
  #   sftp/destination   → /home/billing/destination  (API copy + work/outbound)
  # POST /files/available copies home → destination in the API, then signals the coordinator.
  # Temporal identifies the run by the billing file SHA-256.
  files:
    mode: ${BILLING_FILES_MODE:sftp}   # sftp (Docker) | local (tests only)
    root: ${BILLING_SFTP_ROOT:./sftp}
    # true (default) = start the copy in the background and signal at the same time → locate retries
    #   until a large file finishes landing (durability). false = copy fully, then signal (locate finds
    #   it immediately). Overridable per request with "async": true|false.
    async-copy: ${BILLING_FILES_ASYNC_COPY:true}
    # Demo only: delay (seconds) before the async copy starts, to force visible locate retries.
    copy-delay-seconds: ${BILLING_FILES_COPY_DELAY:0}

  sftp:
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:2222}
    username: ${SFTP_USER:billing}
    password: ${SFTP_PASSWORD:billing}
    home-dir: ${SFTP_HOME_DIR:home}
    destination-dir: ${SFTP_DESTINATION_DIR:destination}

  file-validation:
    # Parent retries locate + hash validation this many times after Signal 2 (corrected file).
    max-retry-attempts: ${BILLING_FILE_RETRY_ATTEMPTS:3}
    retry-interval: 5s

  vendor-api:
    base-url: ${VENDOR_API_URL:http://localhost:8080}
    timeout: 30s
    max-concurrent-calls: ${VENDOR_MAX_CONCURRENT:1000}
    bulk-chunk-size: ${VENDOR_BULK_CHUNK:200}

  customer-api:
    base-url: ${CUSTOMER_API_URL:http://localhost:8080}
    timeout: 30s
    max-concurrent-calls: ${CUSTOMER_MAX_CONCURRENT:1000}
    bulk-chunk-size: ${CUSTOMER_BULK_CHUNK:200}

  discrepancy:
    amount-tolerance: 0.01
    # Each child waits for COMPENSATE, then Continue-As-News to re-process the batch CSV.
    # Loop guard on how many rounds.
    max-resolution-rounds: 10

  workflow:
    # 0 = unbounded. Long-running file coordinator; each child may wait for a COMPENSATE signal.
    execution-timeout: 0s
    child-execution-timeout: 0s
    # Continue-As-New: primary trigger is Temporal's isContinueAsNewSuggested() (covers history size AND
    # event count). This is an optional byte override: 0 = rely on the suggestion; >0 = ALSO force CAN at
    # that history size. Cap is 50MB (Temporal history limit).
    continue-as-new-history-bytes: ${BILLING_CAN_HISTORY_BYTES:0}  # 0 = use isContinueAsNewSuggested(); max 50MB

  rules:
    surcharge-threshold: 10000
    surcharge-rate: 0.02
    mid-tier-threshold: 1000
    mid-tier-flat-fee: 5
    discount-threshold: 5000
    discount-rate: 0.05
    late-days: 30
    late-fee-rate: 0.02

  notifications:
    recipients:
      - billing-ops@example.com
      - finance@example.com
    teams-channel: billing-ops-teams

  # Retry: exponential 1s, 2s, 4s, 8s, 16s
  activities:
    ingestion:
      start-to-close-timeout: 15m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 5
    file-validation:
      start-to-close-timeout: 15m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 3
    enrichment:
      start-to-close-timeout: 30m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 5
    billing-rules:
      start-to-close-timeout: 30m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 5
    reconciliation:
      start-to-close-timeout: 20m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 5
    reporting:
      start-to-close-timeout: 15m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 3
    compensation:
      start-to-close-timeout: 20m
      heartbeat-timeout: 2m
      retry:
        initial-interval: 1s
        backoff-coefficient: 2.0
        maximum-interval: 16s
        maximum-attempts: 3
